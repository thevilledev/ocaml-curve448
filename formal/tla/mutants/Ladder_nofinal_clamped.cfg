\* BROKEN code, but expected to PASS: with X448 clamping bit 0 is always 0,
\* so after the loop swap = 0 and the final cswaps are no-ops.  They are
\* needed only for unclamped scalars (see Ladder_nofinal.cfg).
SPECIFICATION Spec
CONSTANTS
    N = 20
    BYTEBITS = 4
    NBYTES = 2
    CLAMP = TRUE
    BROKEN = "nofinal"
INVARIANTS
    NoError
    ResultCorrect
