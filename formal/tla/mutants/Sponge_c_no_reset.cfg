\* MUTANT (expected to FAIL): Sponge.tla with the deliberate bug "c_no_reset"
\* in the c model; shows that the FIPS 202 comparison detects this kind of error.
SPECIFICATION Spec
CONSTANTS
    RATE = 4
    LANE = 2
    STATEBYTES = 6
    IMPL = "c"
    CALLER = "generic"
    MAXMSG = 11
    OUTLEN = 10
    MAXOFF = 1
    MAXTAIL = 1
    MSGLENS = {}
    CTXLENS = {}
    OUTLENS = {}
    MUTANT = "c_no_reset"
\* Only the functional FIPS 202 invariants: the bug must show up as wrong
\* sponge state or wrong output, not just as a broken structural invariant.
INVARIANTS
    AbsorbInv
    SqueezeInv
