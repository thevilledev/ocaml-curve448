\* Ladder.tla, the code, clamped, with REAL 8-bit bytes: 16-bit scalars of 2
\* bytes, so the clamp is literally k[0] &= 252, k[1] |= 128 (8192 clamped
\* values), every input point of Z/7.
SPECIFICATION Spec
