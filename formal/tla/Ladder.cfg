\* Ladder.tla, the code (BROKEN = "none"), clamped scalars: 8-bit scalars
\* made of 2 bytes of 4 bits (32 clamped values), every input point of the
\* composite-order group Z/20 (orders 2, 4, 5, 10 and 20 all occur, and the
\* ladder passes through the identity).
SPECIFICATION Spec
CONSTANTS
    N = 20
    BYTEBITS = 4
    NBYTES = 2
    CLAMP = TRUE
    BROKEN = "none"
INVARIANTS
    TypeOK
    NoError
    ClampedScalar
    SwapProtocolInv
    ResultCorrect
