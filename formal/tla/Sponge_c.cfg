\* Sponge.tla, generic caller, c implementation, scaled constants:
\* a 6-byte rate made of 3 lanes of 2 bytes and an 8-byte permutation
\* (2-byte capacity).  The caller absorbs up to 25 message bytes (4 whole
\* blocks + 1) in any number of calls of any lengths (0 included), each
\* chunk sitting at offset 0..2 in its buffer with 0..2 bytes after it,
\* finalizes, and squeezes up to 20 bytes (3 blocks + 2) in any number of
\* calls of any lengths, into buffers with the same offset/tail freedom.
SPECIFICATION Spec
CONSTANTS
    RATE = 6
    LANE = 2
    STATEBYTES = 8
    IMPL = "c"
    CALLER = "generic"
    MAXMSG = 25
    OUTLEN = 20
    MAXOFF = 2
    MAXTAIL = 2
    MSGLENS = {}
    CTXLENS = {}
    OUTLENS = {}
    MUTANT = "none"
INVARIANTS
    TypeOK
    NoOutOfRange
    PosInRange
    FastPathAligned
    AbsorbInv
    SqueezeInv
    OutputComplete
