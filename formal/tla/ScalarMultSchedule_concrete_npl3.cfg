\* ScalarMultSchedule.tla, concrete scalars: D = 2 x 2 = 4 digits, every
\* scalar a < 16^4 / 4 = 16384 (the analogue of a < L < 2^446 = 16^112 / 4),
\* limbs of 3 nibbles (so digits come from more than one limb, as with
\* the 8-nibble C limbs and 7-nibble OCaml limbs).  Recoding, both schedules
\* with the actual digits, exact integer points.
SPECIFICATION Spec
CONSTANTS
    MODE = "concrete"
    COMB_R = 2
    COMB_J = 2
    NPL = 3
    BOUND = 16384
INVARIANTS
    NoError
    RecodeLoopInv
    RecodeCorrect
    TableCorrect
