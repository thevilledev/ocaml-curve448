\* Sponge.tla, ed448 caller (hash_to_scalar in backend.ml, ed448_sign /
\* ed448_verify in curve448.h), c implementation, REAL sizes: rate 136,
\* 8-byte lanes, 200-byte state, 114-byte digest.  dom4 = "SigEd448" ||
\* phflag || len(ctx) || ctx, then the parts of each of the four call shapes
\* (see Ed448Schedules).  Context lengths: 0, 1, 12 (dom4 || R || A ends
\* exactly on the first block boundary), 69 (dom4 || prefix does), 126 (dom4
\* does), 127 and 255 (the maximum).  Message lengths: 0, 1, 57, 64 (an
\* Ed448ph prehash), 135..137, 300 and 409 (the OCaml whole-block path is
\* taken inside msg for every context length).
SPECIFICATION Spec
CONSTANTS
    RATE = 136
    LANE = 8
    STATEBYTES = 200
    IMPL = "c"
    CALLER = "ed448"
    MAXMSG = 0
    OUTLEN = 0
    MAXOFF = 0
    MAXTAIL = 0
    MSGLENS = {0, 1, 57, 64, 135, 136, 137, 300, 409}
    CTXLENS = {0, 1, 12, 69, 126, 127, 255}
    OUTLENS = {114}
    MUTANT = "none"
INVARIANTS
    TypeOK
    NoOutOfRange
    PosInRange
    FastPathAligned
    AbsorbInv
    SqueezeInv
    OutputComplete
