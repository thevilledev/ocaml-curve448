\* ScalarMultSchedule.tla, symbolic digits, REAL sizes: 8 x 14 = 112 signed
\* radix-16 digits, base tables spaced 2^32 apart, a 111-window variable-base
\* loop.  Checks both schedules for every digit vector.
SPECIFICATION Spec
CONSTANTS
    MODE = "symbolic"
    COMB_R = 8
    COMB_J = 14
    NPL = 8
    BOUND = 1
INVARIANTS
    NoError
    TableCorrect
    CombInv
    WindowInv
